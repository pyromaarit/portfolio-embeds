<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .project {
      position: relative;
      display: block;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      text-decoration: none;
      border-radius: 4px;
    }

    .project img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    /* White hover layer */
    .project::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.4s ease;
      z-index: 1;
    }

    /* Text */
    .project-info {
      position: absolute;
      inset: 0;
      z-index: 2;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;
      text-align: center;

      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .project-title {
      margin-bottom: 12px;

      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;

      color: #111;
    }

    .project-description {
      max-width: 520px;

      font-size: 16px;
      line-height: 1.5;

      color: #222;
    }

    /* Hover */
    .project:hover img {
      transform: scale(1.05);
    }

    .project:hover::after {
      background: rgba(255, 255, 255, 0.85);
    }

    .project:hover .project-info {
      opacity: 1;
    }

    /* Mobile */
    @media (max-width: 700px) {

      .project-info {
        padding: 25px;
      }

      .project-title {
        font-size: 22px;
      }

      .project-description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- PAX DEI -->
  <a
    class="project"
    href="https://sites.google.com/view/maarit-hakli/portfolio/pax-dei"
    target="_top"
  >

    <img
      src="https://res.cloudinary.com/px5cie66/image/upload/v1788349958/pax-dei-ruokv.jpg"
      alt="Pax Dei"
      loading="eager"
      decoding="async"
    >

    <div class="project-info">

      <div class="project-title">
        PAX DEI
      </div>

      <div class="project-description">
        A social sandbox MMO focused on player-driven crafting,
        building, and community cooperation
      </div>

    </div>

  </a>

</body>
</html>
